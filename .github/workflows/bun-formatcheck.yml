# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, repro/ordinary-pad-solder-mask]

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build pinned altiumts Git dependency
        run: bun run --cwd node_modules/altiumts prepare

      - name: Run format check
        run: bun run format:check
